# ==============================================================================
# SECTION 38: SOVEREIGN CLUSTER HIGH-AVAILABILITY FAILOVER SPECIFICATION
# ==============================================================================
port 26379
dir /tmp

# Monitor core tracking master node instance within GovCloud workspace
# sentinel monitor <master-name> <ip> <port> <quorum>
sentinel monitor yolo-sequence-master yolo-redis-master 6379 2

# Authenticate against encrypted high-security memory parameters
sentinel auth-pass yolo-sequence-master national_security_redis_password_matrix_999

# Terminate node associations if a master goes dark for more than 5 seconds
sentinel down-after-milliseconds yolo-sequence-master 5000

# Enforce strict 30-second window bounds for complete cluster reorganization failovers
sentinel failover-timeout yolo-sequence-master 30000

# Restrict concurrent replica synchronization paths to prevent network congestion
sentinel parallel-syncs yolo-sequence-master 1

# Notification hook targeting internal crash logging daemons on status drift
sentinel notification-script yolo-sequence-master /sovereign/scripts/notify_sentinel_drift.sh
